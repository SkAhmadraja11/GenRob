<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="GenRob — Voice-First Inventory Management for Indian Small Businesses, Kiranas, and Wholesalers" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&family=Tiro+Telugu&display=swap" rel="stylesheet" />
    <title>GenRob — Voice-First Kirana Inventory</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-black min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          try {
            const swUrl = '%BASE_URL%sw.js';
            navigator.serviceWorker.register(swUrl, { scope: '%BASE_URL%' }).catch(err => {
              console.warn('SW registration notice:', err);
            });
          } catch (e) {
            console.warn('SW init notice:', e);
          }
        });
      }
    </script>
  </body>
</html>
